[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-ai-news-assistant"
version = "0.1.0"
description = "Local single-user AI news assistant API"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.18.4",
  "APScheduler==3.11.0",
  "email-validator==2.2.0",
  "fastapi==0.141.1",
  "feedparser==6.0.14",
  "httpx==0.28.1",
  "langchain-core==1.7.7",
  "langchain-openai==1.7.4",
  "langgraph==1.2.24",
  "pydantic==2.14.4",
  "pydantic-settings==2.14.2",
  "python-dotenv==1.2.2",
  "pymysql[rsa]==1.1.2",
  "sqlalchemy==2.0.51",
  "tzdata==2025.2",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.14.0",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "real_llm: requires explicit opt-in and a configured model endpoint",
  "live_rss: requires explicit opt-in and configured public RSS sources",
  "mysql: requires explicit opt-in for disposable records in the configured MySQL schema",
]

[tool.ruff]
line-length = 100
target-version = "py310"
