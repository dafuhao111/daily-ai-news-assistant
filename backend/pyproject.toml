[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-ai-news-assistant"
version = "0.1.0"
description = "Local single-user AI news assistant API"
requires-python = ">=3.10"
dependencies = [
  "alembic==1.18.4",
  "email-validator==2.2.0",
  "fastapi==0.141.1",
  "langchain-core==1.7.7",
  "langchain-openai==1.7.4",
  "langgraph==1.2.24",
  "pydantic==2.14.4",
  "pydantic-settings==2.13.1",
  "python-dotenv==1.1.1",
  "pymysql==1.1.2",
  "sqlalchemy==2.0.51",
  "tzdata==2025.2",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.14.0",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["real_llm: requires explicit opt-in and a configured model endpoint"]

[tool.ruff]
line-length = 100
target-version = "py310"
